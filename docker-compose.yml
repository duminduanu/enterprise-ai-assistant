# Enterprise AI Assistant — containerized POC (Step S bonus)
#
# Prerequisites:
#   1. Copy .env.example → .env and fill API keys
#   2. Ensure BM25 corpus exists: python scripts/ingest_documents.py
#      (or mount ./data/processed as below)
#
# Usage:
#   docker compose up --build
#   UI:      http://localhost:8501
#   API:     http://localhost:8000
#   Health:  http://localhost:8000/health

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: enterprise-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    volumes:
      # Keep BM25 corpus in sync without rebuilding (generated by ingest script)
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: enterprise-ai-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
